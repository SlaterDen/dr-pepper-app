<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr Pepper Price Tracker - Weekly Ads (v2.1.0)</title>

  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#71001A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DP Tracker">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">

  <style>
    :root {
      --dr-pepper: #71001A;
      --gold: #D4AF37;
      --bg: #F4F5F7;
      --card-bg: #FFFFFF;
      --text: #1C1E21;
      --green: #2E7D32;
      --red: #C62828;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      color: var(--dr-pepper);
      margin: 0 0 4px 0;
    }

    .version-tag {
      display: inline-block;
      background-color: var(--dr-pepper);
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 12px;
      vertical-align: middle;
      margin-left: 6px;
    }

    p.subtitle {
      color: #606770;
      margin: 4px 0 0 0;
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select, button {
      padding: 10px 12px;
      border: 1px solid #CCCFD3;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    button {
      background-color: var(--dr-pepper);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 8px;
    }

    button:hover {
      background-color: #500012;
    }

    .btn-delete {
      background-color: transparent;
      color: #D9381E;
      font-size: 0.75rem;
      padding: 4px 8px;
      border: 1px solid #D9381E;
      border-radius: 4px;
      margin-top: 8px;
      cursor: pointer;
    }

    .btn-delete:hover {
      background-color: #D9381E;
      color: white;
    }

    .deals-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-group label {
      margin-bottom: 0;
    }

    .deal-card {
      background: var(--card-bg);
      border: 1px solid #E4E6EB;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s ease;
    }

    .deal-card.best-value {
      border: 2px solid var(--gold);
      background-color: #FFFDF5;
    }

    .badge {
      background-color: var(--gold);
      color: #000;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      margin-left: 8px;
      text-transform: uppercase;
    }

    .badge-stale {
      background-color: #FFF3CD;
      color: #856404;
      border: 1px solid #FFEEBA;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      margin-left: 8px;
      text-transform: uppercase;
    }

    .trend-tag {
      font-weight: 600;
      font-size: 0.8rem;
      margin-left: 6px;
    }

    .trend-up { color: var(--red); }
    .trend-down { color: var(--green); }
    .trend-neutral { color: #606770; }

    .store-title {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .deal-details {
      color: #606770;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .updated-tag {
      color: #4A5568;
      font-size: 0.8rem;
      font-style: italic;
    }

    .expire-tag {
      color: #D9381E;
      font-weight: 500;
    }

    .price-block {
      text-align: right;
    }

    .total-price {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--dr-pepper);
    }

    .unit-price {
      font-size: 0.85rem;
      color: #606770;
      margin-top: 2px;
    }

    a.item-link {
      color: var(--dr-pepper);
      text-decoration: underline;
      font-size: 0.85rem;
    }

    footer {
      text-align: center;
      margin-top: 32px;
      color: #8A8D91;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🥤 Dr Pepper Weekly Ad Tracker <span class="version-tag">v2.1.0</span></h1>
    <p class="subtitle">Compare deals across Target, Amazon, Fresh by Reasor's, Walmart, Dollar General, CVS, Walgreens, and Homeland</p>
  </header>

  <!-- Input Form -->
  <div class="card">
    <form id="dealForm">
      <div class="form-grid">
        <div class="form-group">
          <label for="store">Retailer</label>
          <select id="store" required>
            <option value="Target">Target</option>
            <option value="Amazon">Amazon</option>
            <option value="Fresh by Reasor's">Fresh by Reasor's</option>
            <option value="Walmart">Walmart</option>
            <option value="Dollar General">Dollar General</option>
            <option value="CVS">CVS</option>
            <option value="Walgreens">Walgreens</option>
            <option value="Homeland">Homeland</option>
          </select>
        </div>

        <div class="form-group">
          <label for="product">Packaging Size</label>
          <select id="product" required>
            <option value="12pk-cans" data-oz="144" selected>12-Pack Cans (144 fl oz total)</option>
            <option value="custom-cans" data-oz="custom">Custom 12oz Can Pack (Specify Count)</option>
            <option value="20pk-cans" data-oz="240">20-Pack Cans (240 fl oz total)</option>
            <option value="24pk-cans" data-oz="288">24-Pack Cans (288 fl oz total)</option>
            <option value="6pk-bottles" data-oz="101.4">6-Pack 16.9oz Bottles (101.4 fl oz total)</option>
            <option value="2L-bottle" data-oz="67.6">2-Liter Bottle (67.6 fl oz total)</option>
            <option value="20oz-single" data-oz="20">20 oz Single Bottle (20 fl oz total)</option>
            <option value="4pk-realsugar-12oz" data-oz="48">⭐ Real Sugar 4-Pack 12oz Bottles (48 fl oz)</option>
            <option value="12pk-realsugar" data-oz="144" data-link="https://www.amazon.com/Dr-Pepper-Sugar-Ounce-Bottles/dp/B01DXWPEM0">⭐ Real Sugar 12-Pack 12oz Bottles (144 fl oz)</option>
          </select>
        </div>

        <div class="form-group" id="canCountGroup" style="display: none;">
          <label for="canCount">12 oz Can Count in Pack</label>
          <input type="number" id="canCount" value="12" min="1" placeholder="e.g. 15, 18, 30">
        </div>

        <div class="form-group">
          <label for="dealType">Deal Format</label>
          <select id="dealType" required>
            <option value="standard">Standard / Fixed Multi-Buy (e.g. 3 for $15)</option>
            <option value="pctOff3">Save 40% When You Buy 3</option>
            <option value="wyb3">When You Buy 3 (WYB 3)</option>
            <option value="b2g1">Buy 2, Get 1 FREE</option>
          </select>
        </div>

        <div class="form-group" id="qtyGroup">
          <label for="quantity">Buy Quantity</label>
          <input type="number" id="quantity" value="1" min="1" required>
        </div>

        <div class="form-group">
          <label for="totalPrice" id="priceLabel">Total Sale Price ($)</label>
          <input type="number" id="totalPrice" step="0.01" placeholder="e.g. 15.00" required>
        </div>

        <div class="form-group">
          <label for="expireDate">Deal Expires (Optional)</label>
          <input type="date" id="expireDate">
        </div>

        <div class="form-group full-width">
          <button type="submit">Add / Update Deal</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Tracked Results Display Header with Filter -->
  <div class="deals-header">
    <div>
      <h2 style="margin: 0;">Active Deals</h2>
      <small>Sorted by lowest price per fl oz</small>
    </div>

    <div class="filter-group">
      <label for="filterSize">Filter By Size:</label>
      <select id="filterSize">
        <option value="all">All Sizes</option>
        <option value="12pk-cans" selected>12-Pack Cans</option>
        <option value="20pk-cans">20-Pack Cans</option>
        <option value="24pk-cans">24-Pack Cans</option>
        <option value="6pk-bottles">6-Pack 16.9oz Bottles</option>
        <option value="2L-bottle">2-Liter Bottle</option>
        <option value="20oz-single">20 oz Single Bottle</option>
        <option value="4pk-realsugar-12oz">⭐ Real Sugar 4-Pack Bottles</option>
        <option value="12pk-realsugar">⭐ Real Sugar 12-Pack Bottles</option>
      </select>
    </div>
  </div>

  <div id="dealList"></div>

  <footer>
    Dr Pepper Price Tracker • Version 2.1.0 • Data Saved Locally
  </footer>
</div>

<script>
  const APP_VERSION = "2.1.0";
  const STORAGE_KEY = "dpTracker_v2_1_0";

  const defaultDeals = [
    { id: 1, store: "Target", productKey: "12pk-cans", label: "12-Pack Cans", dealType: "pctOff3", qty: 3, totalPrice: 14.38, unitPriceEach: 7.99, ozPerUnit: 144, expireDate: "", updatedDate: "2026-11-01" },
    { id: 2, store: "Fresh by Reasor's", productKey: "12pk-cans", label: "12-Pack Cans", dealType: "wyb3", qty: 3, totalPrice: 11.97, unitPriceEach: 3.99, ozPerUnit: 144, expireDate: "", updatedDate: "2026-11-04" },
    { id: 3, store: "CVS", productKey: "12pk-cans", label: "12-Pack Cans", dealType: "b2g1", qty: 3, totalPrice: 19.98, unitPriceEach: 9.99, ozPerUnit: 144, expireDate: "", updatedDate: "2026-10-01" },
    { id: 4, store: "Dollar General", productKey: "12pk-cans", label: "12-Pack Cans", dealType: "standard", qty: 3, totalPrice: 15.00, ozPerUnit: 144, expireDate: "", updatedDate: "2026-11-02" },
    { id: 5, store: "Walmart", productKey: "12pk-cans", label: "12-Pack Cans", dealType: "standard", qty: 1, totalPrice: 7.28, ozPerUnit: 144, expireDate: "", updatedDate: "2026-11-05" },
    { id: 6, store: "Amazon", productKey: "12pk-realsugar", label: "Real Sugar 12-Pack 12oz Bottles", dealType: "standard", qty: 1, totalPrice: 29.99, ozPerUnit: 144, expireDate: "", updatedDate: "2026-11-03", link: "https://www.amazon.com/Dr-Pepper-Sugar-Ounce-Bottles/dp/B01DXWPEM0" }
  ];

  const defaultHistory = [
    { store: "Target", productKey: "12pk-cans", pricePerOz: 0.035, date: "2026-10-15" },
    { store: "Fresh by Reasor's", productKey: "12pk-cans", pricePerOz: 0.031, date: "2026-10-12" },
    { store: "Walmart", productKey: "12pk-cans", pricePerOz: 0.048, date: "2026-10-20" }
  ];

  // Automatic Data Migration Engine
  function loadAndMigrateData() {
    let saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        return JSON.parse(saved);
      } catch (e) {
        console.error("Error parsing current version storage:", e);
      }
    }

    // Check for older version keys and migrate forward automatically
    const legacyDeals = localStorage.getItem('drPepperDeals');
    const legacyHistory = localStorage.getItem('drPepperHistory');

    const deals = legacyDeals ? JSON.parse(legacyDeals) : defaultDeals;
    const priceHistory = legacyHistory ? JSON.parse(legacyHistory) : defaultHistory;

    const migratedState = {
      version: APP_VERSION,
      deals: deals,
      priceHistory: priceHistory,
      lastSaved: new Date().toISOString()
    };

    localStorage.setItem(STORAGE_KEY, JSON.stringify(migratedState));
    return migratedState;
  }

  let appData = loadAndMigrateData();
  let deals = appData.deals;
  let priceHistory = appData.priceHistory;

  function saveToLocalStorage() {
    appData.deals = deals;
    appData.priceHistory = priceHistory;
    appData.lastSaved = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  }

  const form = document.getElementById('dealForm');
  const dealList = document.getElementById('dealList');
  const filterSelect = document.getElementById('filterSize');
  const dealTypeSelect = document.getElementById('dealType');
  const productSelect = document.getElementById('product');
  const canCountGroup = document.getElementById('canCountGroup');
  const canCountInput = document.getElementById('canCount');
  const qtyGroup = document.getElementById('qtyGroup');
  const priceLabel = document.getElementById('priceLabel');

  productSelect.addEventListener('change', () => {
    if (productSelect.value === 'custom-cans') {
      canCountGroup.style.display = 'flex';
    } else {
      canCountGroup.style.display = 'none';
    }
  });

  dealTypeSelect.addEventListener('change', () => {
    if (dealTypeSelect.value === 'b2g1') {
      qtyGroup.style.display = 'none';
      priceLabel.innerText = "Single Item Regular Price ($)";
      document.getElementById('totalPrice').placeholder = "e.g. 9.99";
    } else if (dealTypeSelect.value === 'wyb3') {
      qtyGroup.style.display = 'none';
      priceLabel.innerText = "Price Each WYB 3 ($)";
      document.getElementById('totalPrice').placeholder = "e.g. 3.99";
    } else if (dealTypeSelect.value === 'pctOff3') {
      qtyGroup.style.display = 'none';
      priceLabel.innerText = "Single Item Regular Price ($)";
      document.getElementById('totalPrice').placeholder = "e.g. 7.99";
    } else {
      qtyGroup.style.display = 'flex';
      priceLabel.innerText = "Total Sale Price ($)";
      document.getElementById('totalPrice').placeholder = "e.g. 15.00";
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const store = document.getElementById('store').value;
    const productKey = productSelect.value;
    let label = productSelect.options[productSelect.selectedIndex].text.split(' (')[0].replace('⭐ ', '');
    let ozPerUnit = 144;

    if (productKey === 'custom-cans') {
      const count = parseInt(canCountInput.value, 10) || 12;
      ozPerUnit = count * 12;
      label = `${count}-Pack 12oz Cans`;
    } else {
      ozPerUnit = parseFloat(productSelect.options[productSelect.selectedIndex].dataset.oz);
    }

    const link = productSelect.options[productSelect.selectedIndex].dataset.link || "";
    const dealType = dealTypeSelect.value;
    const expireDate = document.getElementById('expireDate').value;
    const todayStr = new Date().toISOString().split('T')[0];

    let qty = 1;
    let totalPrice = 0;
    let unitPriceEach = 0;

    if (dealType === 'b2g1') {
      qty = 3;
      unitPriceEach = parseFloat(document.getElementById('totalPrice').value);
      totalPrice = unitPriceEach * 2;
    } else if (dealType === 'wyb3') {
      qty = 3;
      unitPriceEach = parseFloat(document.getElementById('totalPrice').value);
      totalPrice = unitPriceEach * 3;
    } else if (dealType === 'pctOff3') {
      qty = 3;
      unitPriceEach = parseFloat(document.getElementById('totalPrice').value);
      totalPrice = (unitPriceEach * 3) * 0.60;
    } else {
      qty = parseInt(document.getElementById('quantity').value, 10);
      totalPrice = parseFloat(document.getElementById('totalPrice').value);
    }

    const currentPricePerOz = totalPrice / (qty * ozPerUnit);

    priceHistory.push({
      store,
      productKey,
      pricePerOz: currentPricePerOz,
      date: todayStr
    });

    const newDeal = {
      id: Date.now(),
      store,
      productKey,
      label,
      dealType,
      qty,
      totalPrice,
      unitPriceEach,
      ozPerUnit,
      expireDate,
      updatedDate: todayStr,
      link
    };

    const existingIndex = deals.findIndex(d => d.store === store && d.productKey === productKey);

    if (existingIndex !== -1) {
      deals[existingIndex] = { ...newDeal, id: deals[existingIndex].id };
    } else {
      deals.push(newDeal);
    }

    saveToLocalStorage();
    form.reset();
    productSelect.dispatchEvent(new Event('change'));
    dealTypeSelect.dispatchEvent(new Event('change'));
    renderDeals();
  });

  function deleteDeal(id) {
    deals = deals.filter(deal => deal.id !== id);
    saveToLocalStorage();
    renderDeals();
  }

  filterSelect.addEventListener('change', renderDeals);

  function calculateTrend(store, productKey, currentPricePerOz) {
    const thirtyDaysAgo = new Date();
    thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

    const relevantHistory = priceHistory.filter(h =>
      h.store === store &&
      h.productKey === productKey &&
      new Date(h.date) >= thirtyDaysAgo
    );

    if (relevantHistory.length < 2) return null;

    const previousPrices = relevantHistory.slice(0, relevantHistory.length - 1);
    const avgPrevPrice = previousPrices.reduce((sum, item) => sum + item.pricePerOz, 0) / previousPrices.length;

    const diff = currentPricePerOz - avgPrevPrice;
    if (Math.abs(diff) < 0.001) {
      return { direction: 'neutral', text: '➖ 0%' };
    } else if (diff < 0) {
      const pct = Math.abs((diff / avgPrevPrice) * 100).toFixed(1);
      return { direction: 'down', text: `🟢 🠗 ${pct}% (30d)` };
    } else {
      const pct = ((diff / avgPrevPrice) * 100).toFixed(1);
      return { direction: 'up', text: `🔴 🠕 ${pct}% (30d)` };
    }
  }

  function renderDeals() {
    dealList.innerHTML = '';
    const selectedFilter = filterSelect.value;
    const now = new Date();

    const activeDeals = deals.filter(deal => {
      if (!deal.expireDate) return true;
      const expDate = new Date(deal.expireDate + 'T23:59:59');
      return now <= expDate;
    });

    const filteredDeals = activeDeals.filter(deal => selectedFilter === 'all' || deal.productKey === selectedFilter);

    if (filteredDeals.length === 0) {
      dealList.innerHTML = '<p style="color: #606770;">No active deals available for the selected size filter.</p>';
      return;
    }

    const processedDeals = filteredDeals.map(deal => {
      const totalOunces = deal.qty * deal.ozPerUnit;
      const pricePerOz = deal.totalPrice / totalOunces;
      return { ...deal, totalOunces, pricePerOz };
    });

    processedDeals.sort((a, b) => a.pricePerOz - b.pricePerOz);

    processedDeals.forEach((deal, index) => {
      const isBest = index === 0 && processedDeals.length > 1;
      const card = document.createElement('div');
      card.className = `deal-card ${isBest ? 'best-value' : ''}`;

      let isStale = false;
      if (deal.updatedDate) {
        const lastUpdated = new Date(deal.updatedDate + 'T00:00:00');
        const diffDays = Math.floor((now - lastUpdated) / (1000 * 60 * 60 * 24));
        if (diffDays > 30) isStale = true;
      }

      let promoText = '';
      if (deal.dealType === 'b2g1') {
        promoText = `Buy 2 Get 1 FREE ($${deal.unitPriceEach.toFixed(2)} reg. each)`;
      } else if (deal.dealType === 'wyb3') {
        promoText = `$${deal.unitPriceEach.toFixed(2)} each WYB 3`;
      } else if (deal.dealType === 'pctOff3') {
        promoText = `Save 40% WYB 3 ($${deal.unitPriceEach.toFixed(2)} reg. each)`;
      } else {
        promoText = deal.qty > 1 ? `${deal.qty} for $${deal.totalPrice.toFixed(2)}` : `$${deal.totalPrice.toFixed(2)} each`;
      }

      let expireHTML = '';
      if (deal.expireDate) {
        const dateObj = new Date(deal.expireDate + 'T00:00:00');
        const formattedDate = dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        expireHTML = ` • <span class="expire-tag">Expires: ${formattedDate}</span>`;
      }

      let updatedHTML = '';
      if (deal.updatedDate) {
        const dateObj = new Date(deal.updatedDate + 'T00:00:00');
        const formattedUpdated = dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        updatedHTML = ` • <span class="updated-tag">Updated: ${formattedUpdated}</span>`;
      }

      const trend = calculateTrend(deal.store, deal.productKey, deal.pricePerOz);
      let trendHTML = '';
      if (trend) {
        trendHTML = `<span class="trend-tag trend-${trend.direction}">${trend.text}</span>`;
      }

      let linkHTML = deal.link ? `<br><a href="${deal.link}" target="_blank" class="item-link">View Item on Amazon ↗</a>` : '';
      let staleBadgeHTML = isStale ? `<span class="badge-stale">⚠️ Old Data, Please Confirm Price</span>` : '';

      card.innerHTML = `
        <div>
          <span class="store-title">${deal.store}</span>
          ${isBest ? '<span class="badge">Best Value</span>' : ''}
          ${staleBadgeHTML}
          ${trendHTML}
          <div class="deal-details">${deal.label} • (${promoText})${expireHTML}${updatedHTML}${linkHTML}</div>
          <button class="btn-delete" onclick="deleteDeal(${deal.id})">Remove</button>
        </div>
        <div class="price-block">
          <div class="total-price">$${deal.totalPrice.toFixed(2)} total</div>
          <div class="unit-price">$${deal.pricePerOz.toFixed(3)} / fl oz</div>
        </div>
      `;

      dealList.appendChild(card);
    });
  }

  renderDeals();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('Service Worker Registered!', reg))
        .catch((err) => console.error('Service Worker Registration Failed:', err));
    });
  }
</script>

</body>
</html>
